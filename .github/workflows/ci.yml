name: CI

# verify (salt-mountain/ops) runs on every PR — it's the required check, so bot
# PRs only auto-merge on green — and again on main, where it gates the deploy:
# nothing reaches Cloudflare unless the exact commit on main passed verify.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write # verify opens/closes an alert issue when main fails/recovers
  pull-requests: write # dependency-review comment

# Cancel superseded PR runs, but never a run on main: that would cancel an
# in-flight deploy (a partial deploy). Main runs queue instead.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    uses: salt-mountain/ops/.github/workflows/verify.yml@8b71168c0555447a6693122511e876d9fb2b6965 # v1.1.3
    with:
      dependency_review: true
      node_version: "24" # keep in step with the deploy job (Renovate moves both)

  deploy:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Cloudflare auth comes from secrets, not GITHUB_TOKEN.
    permissions:
      contents: read
    # Serialize deploys across runs; never cancel one mid-flight.
    concurrency:
      group: deploy-cloudflare-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        # Bun version comes from package.json "packageManager" (pinned), not
        # "latest". Keep .bun-version in sync for local tooling.

      - run: bun install --frozen-lockfile

      - run: bun run build

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name osim-dev
