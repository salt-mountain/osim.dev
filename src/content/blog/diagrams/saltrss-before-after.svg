<text class="d-lbl-block" x="240" y="34" text-anchor="middle">Before: an algorithmic feed</text>
<text class="d-t1" x="130" y="99" text-anchor="middle">Accounts you follow</text>
<text class="d-t1" x="350" y="99" text-anchor="middle">Ads &amp; suggested posts</text>
<text class="d-t1" x="240" y="214" text-anchor="middle">The platform ranks it</text>
