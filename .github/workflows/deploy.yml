name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

# Cloudflare auth comes from the CLOUDFLARE_API_TOKEN secret, not GITHUB_TOKEN,
# so the workflow token only needs read access to the repo.
permissions:
  contents: read

# Serialize deploys; do NOT cancel an in-flight one (cancelling mid-deploy could
# leave a partial deploy).
concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        # Bun version comes from .bun-version (pinned), not "latest".

      - run: bun install --frozen-lockfile

      - run: bun run build

      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name osim-dev
